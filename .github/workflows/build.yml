name: Build desktop apps
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows test installers
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Build macOS test packages
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run verify:package
      - run: npm run test:packaged
      - run: npm run size:report
      - uses: actions/upload-artifact@v4
        with:
          name: porty-${{ matrix.os }}-unsigned-test
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/size-report.json
          if-no-files-found: error
