name: macOS preview release

on:
  workflow_run:
    workflows: ["Windows preview release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Windows preview tag to add macOS downloads to
        required: true
        default: v1.0.3

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event.workflow_run.head_sha || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve the published Windows source commit
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        with:
          script: |
            const repo = context.repo;
            async function packageAt(ref) {
              const { data } = await github.rest.repos.getContent({ ...repo, path: 'package.json', ref });
              return JSON.parse(Buffer.from(data.content, 'base64').toString());
            }
            const runSha = context.payload.workflow_run?.head_sha;
            const tag = context.eventName === 'workflow_dispatch'
              ? process.env.REQUESTED_TAG
              : `v${(await packageAt(runSha)).version}`;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) throw new Error('Invalid release tag');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            if (release.draft || !release.prerelease) throw new Error('An existing published preview release is required');
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: tag });
            if (runSha && commit.sha !== runSha) throw new Error('Windows run and release tag point to different commits');
            const version = (await packageAt(commit.sha)).version;
            if (tag !== `v${version}`) throw new Error('Tag must match package.json version');
            for (const kind of ['setup', 'portable']) {
              const name = `Porty-${version}-windows-x64-${kind}.exe`;
              if (!release.assets.some(a => a.name === name && a.state === 'uploaded')) throw new Error(`Missing Windows asset: ${name}`);
            }
            core.setOutput('tag', tag);
            core.setOutput('version', version);
            core.setOutput('sha', commit.sha);

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify native runner architecture
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Wrong runner architecture')"
      - run: npm ci
      - run: npm test
      - name: Build macOS preview packages
        run: npm run dist:mac -- --${{ matrix.arch }}
      - run: npm run verify:package
      - run: npm run test:packaged
      - run: npm run size:report
      - uses: actions/upload-artifact@v4
        with:
          name: porty-macos-preview-${{ matrix.arch }}
          path: |
            release/Porty-${{ needs.resolve.outputs.version }}-mac-${{ matrix.arch }}.dmg
            release/Porty-${{ needs.resolve.outputs.version }}-mac-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: macos-publish-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # Publisher code comes from this workflow revision; app binaries above
      # always come from the immutable version tag, including manual backfills.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/macos-release.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: porty-macos-preview-*
          merge-multiple: true
          path: release/public
      - name: Publish verified Mac assets without replacing Windows downloads
        run: node scripts/publish-macos-preview.mjs
